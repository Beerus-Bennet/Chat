<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Hintergrund-Gradient: tief dunkelblau wie die App -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0F14"/>
      <stop offset="100%" style="stop-color:#111318"/>
    </linearGradient>
    <!-- Akzent-Gradient für die Sprechblase -->
    <linearGradient id="bubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#1E40AF"/>
    </linearGradient>
    <!-- Schimmer oben links -->
    <radialGradient id="glow" cx="35%" cy="30%" r="55%">
      <stop offset="0%" style="stop-color:#1d4ed8;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#0D0F14;stop-opacity:0"/>
    </radialGradient>
    <!-- Subtle inner border gradient -->
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.14)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.04)"/>
    </linearGradient>
    <!-- Schloss-Schimmer -->
    <radialGradient id="lockglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="bubbleshadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="18" flood-color="#1d4ed8" flood-opacity="0.4"/>
    </filter>
    <filter id="glowfilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="roundedSquare">
      <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230"/>
    </clipPath>
  </defs>

  <!-- App Icon Hintergrund -->
  <g clip-path="url(#roundedSquare)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- Glow oben links -->
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <!-- Sehr subtile Struktur-Linien (wie ein feines Grid) -->
    <line x1="0" y1="512" x2="1024" y2="512" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    <line x1="512" y1="0" x2="512" y2="1024" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </g>

  <!-- Haupt-Sprechblase (groß, links-oben) -->
  <g filter="url(#bubbleshadow)" clip-path="url(#roundedSquare)">
    <rect x="148" y="200" width="680" height="450" rx="72" ry="72" fill="url(#bubble)"/>
    <!-- Spitze der Blase unten links -->
    <polygon points="230,650 180,780 340,650" fill="#1E40AF"/>
  </g>

  <!-- Zweite kleine Sprechblase (Antwort, rechts versetzt, dunkler) -->
  <rect x="310" y="540" width="460" height="200" rx="52" ry="52" fill="#1C1F28" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>
  <!-- Spitze rechts unten -->
  <polygon points="700,740 780,830 670,740" fill="#1C1F28"/>

  <!-- Schloss-Icon in der großen Blase (E2E-Verschlüsselung) -->
  <!-- Schloss-Körper -->
  <rect x="430" y="370" width="164" height="130" rx="22" ry="22" fill="rgba(255,255,255,0.92)" filter="url(#glowfilter)"/>
  <!-- Schloss-Bügel -->
  <path d="M468 370 L468 315 Q512 268 556 315 L556 370" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Schloss-Loch -->
  <circle cx="512" cy="430" r="22" fill="#1E40AF"/>
  <rect x="502" y="430" width="20" height="26" rx="4" fill="#1E40AF"/>

  <!-- Drei Punkte in der kleinen Blase (Typing Indicator) -->
  <circle cx="420" cy="640" r="18" fill="rgba(59,130,246,0.85)"/>
  <circle cx="512" cy="640" r="18" fill="rgba(59,130,246,0.60)"/>
  <circle cx="604" cy="640" r="18" fill="rgba(59,130,246,0.35)"/>

  <!-- Subtiler Border -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230"
        fill="none" stroke="url(#border)" stroke-width="2"
        clip-path="url(#roundedSquare)"/>
</svg>
